[package]
name = "fff-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "The slice of fff (https://github.com/dmtrKovalenko/fff) that roto's launcher uses, as a C API"

[lib]
crate-type = ["staticlib"]

[dependencies]
fff-search = { version = "=0.11.0", default-features = false, features = ["ripgrep"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"
